# SonarQube Cloud, CI-based analysis (swarm-routing/.github reusable-ns3-ci.yml,
# input `sonar`). The project must use CI-based analysis, not Automatic
# Analysis (SonarQube Cloud: Administration > Analysis Method), or the CI step
# skips with a warning.
sonar.organization=swarm-routing
sonar.projectKey=swarm-routing_ns3-tools
sonar.sourceEncoding=UTF-8

# Only this repository's own code: everything under the checkout except tests,
# examples, generated output and vendored code (ns-3 itself and dependencies
# are outside the checkout). Narrow sonar.sources to directories (core,ns3)
# once they exist if you prefer an explicit list.
sonar.sources=.
sonar.exclusions=**/test/**,**/tests/**,**/examples/**,build/**,deps/**,docs/**,**/third_party/**,**/vendor/**
sonar.tests=.
sonar.test.inclusions=**/test/**,**/tests/**,**/examples/**

# Written by the CI step: the compile database of this repository's files
# (ns-3's own entries dropped) and gcovr's SonarQube coverage report.
sonar.cfamily.compile-commands=build/compile_commands.json
sonar.coverageReportPaths=coverage-sonar.xml
