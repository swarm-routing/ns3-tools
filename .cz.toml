# Releases go through swarm-routing/.github's reusable-release.yml
# (.github/workflows/release.yml; CONTRIBUTING "Cutting a release" there).
# The first release is v0.1.0; Commitizen then bumps from the Conventional
# Commits since the last tag and rewrites the files below.
[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_scheme = "semver"
tag_format = "v$version"
major_version_zero = true
update_changelog_on_bump = true
# Matched per line, so only the [project] version changes.
version_files = ["python/pyproject.toml:^version = "]
