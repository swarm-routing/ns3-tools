# org-sync configuration (swarm-routing/.github tools/org-sync).
kind = "protocol"
# CITATION.cff seed and cite badge. Once Zenodo archives a release: set zenodo_concept = "<record id>"
# (read from Zenodo), then `org_sync.py reseed CITATION.cff` so CITATION.cff names the DOI.
citation = true
# the Zenodo concept record (read from zenodo.org on 2026-11-11, v0.1.0 archived)
zenodo_concept = "24136068"
title = "ns3-tools"
module = "routing-bench"
dual = ["python/", "tools/"]
ci_workflow = "ns3.yml"
python = "3.11"
badges = ["ci", "release", "doi", "cite", "licence", "conventional", "arena", "cxx", "ns3", "ns3dev", "python", "sonar", "codecov", "coderabbit"]
trust_boundary = """
The `ns3-tool` readers of `##CONFIG##`/`##RUN##`/`##BENCH##`/`##DIAG##`
lines and campaign CSVs (`python/ns3_tool/`). Their input is log output that
may come from someone else's run (a pull request's artifact, a downloaded
dataset). They never execute what they read (no `eval`, no pickle, no
shell; stdlib only). They do not yet reject every malformed line: a field
that does not parse is skipped, so a `##RUN##` row with a readable PDR is
kept with that metric missing for that seed, and a summary can treat an
unreadable CSV value as missing. Malformed input can therefore change a
verdict instead of failing; a strict default is #58."""
limitations = """
- The probes, arenas and the `routing-bench` harness are simulation code: a
  probe trusts the simulator it is attached to.
- A comparator arm here is a model of a published protocol for ns-3, not an
  implementation for real networks."""
verifying = """
Releases from v0.1.0 on (#26) are built, signed and published by the org's
release workflow (`swarm-routing/.github` `reusable-release.yml`, called by
`.github/workflows/release.yml`). Each carries `routing-bench-X.Y.Z.tar.gz`
(the harness module, for ns-3's `contrib/`), the `ns3-tool` wheel and sdist,
`SHA256SUMS`, a CycloneDX SBOM (`ns3-tools-X.Y.Z.cdx.json`) and signed SLSA
build provenance for every asset (`ns3-tools-X.Y.Z.intoto.jsonl`, and the
Sigstore bundle `ns3-tools-X.Y.Z.sigstore.json` for offline checks). The
workflow runs these checks itself before it publishes, and builds the
tarball in a clean `ns3-dev` tree and runs `test.py -s routing-bench` on it
first, so a release that fails either never goes out. With the
[GitHub CLI](https://cli.github.com/):

```bash
sha256sum -c SHA256SUMS --ignore-missing
gh attestation verify routing-bench-X.Y.Z.tar.gz --repo swarm-routing/ns3-tools \
  --signer-workflow swarm-routing/.github/.github/workflows/reusable-release.yml
gh attestation verify routing-bench-X.Y.Z.tar.gz --repo swarm-routing/ns3-tools \
  --predicate-type https://cyclonedx.org/bom \
  --signer-workflow swarm-routing/.github/.github/workflows/reusable-release.yml
# offline: fetch the trusted root while online (gh attestation trusted-root > trusted_root.jsonl)
gh attestation verify routing-bench-X.Y.Z.tar.gz --repo swarm-routing/ns3-tools \
  --bundle ns3-tools-X.Y.Z.sigstore.json --custom-trusted-root trusted_root.jsonl \
  --signer-workflow swarm-routing/.github/.github/workflows/reusable-release.yml
```

The same commands verify the wheel and the sdist. The signer is the org's
reusable workflow, not this repository, so every command names it with
`--signer-workflow` (without it `gh` expects a workflow of `--repo`); this
repository is in the certificate's workflow-repository extension. Each release also publishes the image
`ghcr.io/swarm-routing/ns3-tools-ns3:vX.Y.Z-optimized` and `-debug`, the
harness built on a pinned `ns3-dev` digest, signed with cosign (keyless):
see `swarm-routing/.github` `reusable-ns3-image.yml` for its verify commands."""
[make]
build = 'docker run --rm -v "$(CURDIR):/src:ro" $(NS3_IMAGE) ns3-build-contrib routing-bench=/src/ns3/routing-bench'
test = 'for t in python/tests/test_*.py; do python3 "$$t" || exit 1; done'

[settings]
# GitHub settings as code: swarm-routing/.github tools/repo-settings (swarm-routing/.github#117).
description = "Protocol-agnostic ns-3 comparison and diagnostics tooling: the routing-bench harness every protocol arm registers with, the readers and paired statistics for its marker lines, and (planned) probes, universal arenas and the ns3-tool CLI."
homepage = "https://swarm-routing.github.io/arena/ns3-tools/"
topics = ["ns-3", "benchmarking", "routing-protocol", "manet", "network-simulation", "statistics", "reproducibility", "aodv", "olsr"]
ruleset = "tooling"
# Off for now (maintainer decision 2026-11-11): `false` strips the `release` environment's
# required reviewer and wait timer, so release.yml's publish job no longer waits for an
# approval. `true` turns the gate back on (swarm-routing/.github CONTRIBUTING "Automation").
release_environment = false
# Not `stock arms deliver (...)`: their names carry the temporary ns-3.48 pin
# (ns3-containers#35) and change when it moves. Not `module / format` (skipped until
# formatting is checked).
required_checks = ["module / ns-latest debug", "module / ns-latest sanitized", "module / headers / licence", "python-quality / python", "ns3-tool tests (Python 3.11)", "ns3-tool tests (Python 3.13)", "query equivalence on AntHocNet's committed cells", "check / org-sync", "title / title", "review / coderabbit"]
# Merge through a merge queue (swarm-routing/.github#130); every workflow behind a required
# check also runs on merge_group.
merge_queue = true
