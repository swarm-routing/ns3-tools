name: Release

# The org release pipeline (swarm-routing/.github reusable-release.yml;
# CONTRIBUTING "Cutting a release" there), #26:
#   dispatch `dry-run`  bump, build, attest and verify on the runner only;
#   dispatch `bump`     open the PR `chore(release): bump version A to B`
#                       from bot/release (Commitizen, .cz.toml);
#   merge that PR       the release: `make dist` builds and checks the assets
#                       (routing-bench-<ver>.tar.gz, the ns3-tool wheel and
#                       sdist; tools/release/dist.sh), then SBOM, checksums,
#                       signed provenance, the v<ver> tag and the GitHub release.
# The `image` job then publishes ghcr.io/swarm-routing/ns3-tools:v<ver>-{optimized,debug}
# and moves latest-{optimized,debug} and latest to them (named after the
# repository, swarm-routing/.github#370 and swarm-routing/.github#373;
# v0.1.0 is in the frozen ns3-tools-ns3)
# with the harness built in (CONTRIBUTING "Images").
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run: bump, build, attest and verify on the runner only; bump: open the bump PR (merging it releases)"
        type: choice
        options: [dry-run, bump]
        default: dry-run
      increment:
        description: "auto: Commitizen picks the bump from the commits; PATCH, MINOR or MAJOR force it (cz bump --increment; MAJOR for v1.0.0 and v2.0.0)"
        type: choice
        options: [auto, PATCH, MINOR, MAJOR]   # a choice cannot be empty: auto is passed as ''
        default: auto
  push:
    branches: [main]   # the merged bump PR releases; any other push is a no-op
permissions:
  contents: read
# One run per commit at a time, never cancelled (a later run must not replace
# a merged bump's pending release).
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false
jobs:
  release:
    # Saves a runner on ordinary pushes; the workflow itself checks the PR.
    if: "${{ github.event_name != 'push' || startsWith(github.event.head_commit.message, 'chore(release): bump version ') }}"
    permissions: { contents: write, pull-requests: write, id-token: write, attestations: write }
    uses: swarm-routing/.github/.github/workflows/reusable-release.yml@main
    with:
      mode: ${{ inputs.mode }}   # empty on push: release
      increment: ${{ inputs.increment != 'auto' && inputs.increment || '' }}   # '' for auto and on push
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      ORG_BOT_TOKEN: ${{ secrets.ORG_BOT_TOKEN }}

  image:
    needs: release
    if: ${{ needs.release.outputs.mode == 'release' }}
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    uses: swarm-routing/.github/.github/workflows/reusable-ns3-image.yml@main
    with:
      modules: routing-bench=ns3/routing-bench
      image: ns3-tools
      tag: ${{ needs.release.outputs.tag }}
