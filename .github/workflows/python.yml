name: Python

on:
  pull_request:
  merge_group:  # the merge queue runs the required checks on each group (swarm-routing/.github#130)
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request cancels this run (swarm-routing/.github#505):
# runners are shared by the whole org. Pushes, merge groups and dispatches run to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: ns3-tool tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']  # 3.11: tomllib
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      # a docs-only change skips the steps below; the check still reports (swarm-routing/.github#581)
      - uses: swarm-routing/.github/.github/actions/changes@main
        id: changes
        timeout-minutes: 2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Self-tests (fixtures)
        if: steps.changes.outputs.docs-only != 'true'
        run: for t in python/tests/test_*.py; do echo "== $t"; python3 "$t"; done
      # ns3-tools#247: every reference in the ns-3 bug register and its RCAPAs
      # is fully qualified (swarm-routing/<repo>#N, nsnam/ns-3-dev#N|!N links).
      - name: References in the bug register are fully qualified
        # reads docs/: runs on a docs-only change too
        run: |
          python3 -I tools/checks/check-refs.py --self-test
          python3 -I tools/checks/check-refs.py docs/ns3-bugs.md docs/ns3-rcapa/
      - name: Install the package; console scripts run
        if: steps.changes.outputs.docs-only != 'true'
        run: |
          python3 -m pip install ./python
          cd "$RUNNER_TEMP"
          ns3-bench-parse "$GITHUB_WORKSPACE"/python/tests/fixtures/cells/fanet-main-6arm.txt | grep -q '95% CI'
          ns3-scenario-check results "$GITHUB_WORKSPACE"/python/tests/fixtures/cells/sat-base-app517.txt \
            --anchors "$GITHUB_WORKSPACE"/python/tests/fixtures/anchors.yml | grep -q '^verdict: '
          ns3-campaign validate "$GITHUB_WORKSPACE"/campaigns/anthocnet-aodv-smoke.toml
          ns3-tool --help | grep -q '  scaffold '
          ns3-tool compare "$GITHUB_WORKSPACE"/python/tests/fixtures/cells/fanet-main-6arm.txt | grep -q '95% CI'

  corpus:
    name: query equivalence on AntHocNet's committed cells
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      # a docs-only change skips the steps below; the check still reports (swarm-routing/.github#581)
      - uses: swarm-routing/.github/.github/actions/changes@main
        id: changes
        timeout-minutes: 2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.changes.outputs.docs-only != 'true'
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.changes.outputs.docs-only != 'true'
        with:
          repository: swarm-routing/AntHocNet
          path: anthocnet
          sparse-checkout: |
            results/cells
            tools/bench/scenario_check.py
            tools/bench/campaign.py
            tools/bench/bench_parse.py
            tools/bench/stats_util.py
            tools/bench/campaigns
          persist-credentials: false
      - run: NS3_TOOL_CELLS="$PWD/anthocnet/results/cells" python3 python/tests/test_bench_parse_query.py
        if: steps.changes.outputs.docs-only != 'true'
      # ns3-tools#28: the port's verdicts equal AntHocNet's script on every cell.
      - if: steps.changes.outputs.docs-only != 'true'
        run: |
          NS3_TOOL_CELLS="$PWD/anthocnet/results/cells" \
          NS3_TOOL_SCENARIO_CHECK="$PWD/anthocnet/tools/bench/scenario_check.py" \
            python3 python/tests/test_scenario_check_corpus.py
      # ns3-tools#81: change-plan verdicts equal AntHocNet's campaign.py on
      # every committed plan (the plans are YAML: PyYAML, for both scripts).
      - name: PyYAML
        if: steps.changes.outputs.docs-only != 'true'
        timeout-minutes: 5
        run: |
          python3 -m pip install --quiet --only-binary :all: pyyaml==6.0.3
      - run: NS3_TOOL_ANTHOCNET="$PWD/anthocnet" python3 python/tests/test_change_plan.py
        if: steps.changes.outputs.docs-only != 'true'

# ruff and the self-tests under coverage (reusable-python-ci.yml) run in
# ns3.yml, job `python-quality`: the SonarQube Cloud scan there imports their
# coverage, and an artifact reaches only jobs of its own run (#67).
