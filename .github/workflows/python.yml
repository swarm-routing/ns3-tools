name: Python

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: ns3-tool tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']  # 3.11: tomllib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Self-tests (fixtures)
        run: for t in python/tests/test_*.py; do echo "== $t"; python3 "$t"; done
      - name: Install the package; console scripts run
        run: |
          python3 -m pip install ./python
          cd "$RUNNER_TEMP"
          ns3-bench-parse "$GITHUB_WORKSPACE"/python/tests/fixtures/cells/fanet-main-6arm.txt | grep -q '95% CI'
          ns3-scenario-check results "$GITHUB_WORKSPACE"/python/tests/fixtures/cells/sat-base-app517.txt \
            --anchors "$GITHUB_WORKSPACE"/python/tests/fixtures/anchors.yml | grep -q '^verdict: '
          ns3-campaign validate "$GITHUB_WORKSPACE"/campaigns/anthocnet-aodv-smoke.toml

  corpus:
    name: query equivalence on AntHocNet's committed cells
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: danieljoppi/AntHocNet
          path: anthocnet
          sparse-checkout: |
            results/cells
            tools/bench/scenario_check.py
          persist-credentials: false
      - run: NS3_TOOL_CELLS="$PWD/anthocnet/results/cells" python3 python/tests/test_bench_parse_query.py
      # ns3-tools#28: the port's verdicts equal AntHocNet's script on every cell.
      - run: |
          NS3_TOOL_CELLS="$PWD/anthocnet/results/cells" \
          NS3_TOOL_SCENARIO_CHECK="$PWD/anthocnet/tools/bench/scenario_check.py" \
            python3 python/tests/test_scenario_check_corpus.py

# ruff and the self-tests under coverage (reusable-python-ci.yml) run in
# ns3.yml, job `python-quality`: the SonarQube Cloud scan there imports their
# coverage, and an artifact reaches only jobs of its own run (#67).
