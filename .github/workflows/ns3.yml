name: ns-3

# The routing-bench harness (ns3/routing-bench, moved from AntHocNet, #2) in
# ghcr.io/swarm-routing/ns3-dev: build + test.py on the release ns-3 supports
# (`latest`, debug and sanitized), then the stock arms must each deliver.
#
# TEMPORARY EXCEPTION (ns3-containers#35, AntHocNet#843, option A): on
# ns-3.49 stock AODV livelocks, so the aodv arm's delivery check runs on
# ns3-dev:3.48 until the first ns-3 release with the fix reaches `latest`;
# then move `aodv` into the latest leg and drop the 3.48 one.
#
# The Python quality job (ruff + coverage.py over python/tests) runs here too,
# not in python.yml: SonarQube Cloud keeps one analysis per branch, so the one
# scan (in the module job) imports both gcovr's C++ report and coverage.py's
# Python report, and an artifact reaches only jobs of its own run (#67).
on:
  push:
    branches: [main]
  pull_request:
  merge_group:  # the merge queue runs the required checks on each group (swarm-routing/.github#130)
  workflow_dispatch:
    inputs:
      ns3-versions:
        description: 'On demand: JSON list of older ns-3 releases for the module build, e.g. ["3.42"]'
        default: ''

permissions:
  contents: read
  packages: read

jobs:
  dev-images:
    # The campaign images' 2-day retention (swarm-routing/.github#370, #169):
    # ns3-tools-dev versions older than 2 days that no committed file and no
    # open swarm-routing/benchmarks pull request pins are deleted, on main only.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: swarm-routing/.github/.github/workflows/reusable-dev-image-cleanup.yml@main
    with:
      packages: ns3-tools-dev

  python-quality:
    # ruff (org ruff.toml) + the self-tests under coverage, report-only
    # (swarm-routing/.github#35, phase 1); keeps the `python-coverage` artifact.
    uses: swarm-routing/.github/.github/workflows/reusable-python-ci.yml@main
    with:
      paths: python
      tests: python/tests/test_*.py
      source: python/ns3_tool

  module:
    # After the Python job, whose coverage the scan imports; but a ruff finding
    # there must not stop the ns-3 build (the scan then warns: C++ coverage only).
    needs: python-quality
    if: ${{ !cancelled() }}
    uses: swarm-routing/.github/.github/workflows/reusable-ns3-ci.yml@main
    with:
      modules: routing-bench=ns3/routing-bench
      ns3-versions: ${{ inputs.ns3-versions || '["latest"]' }}
      # The harness keeps AntHocNet's formatting while it moves (a restyle would
      # hide the move in the diff); adopting the org .clang-format is its own PR.
      format: false
      # Org invariant 5: seed 1 twice byte-identical, seed 2 different
      # (swarm-routing/.github#26). OLSR: the stock arm that delivers on `latest`.
      # --perf=0: ##PERF## is CPU and wall time, which differ run to run by
      # nature (#91); the gate compares results. check-perf-markers.sh (the
      # stock-arms job) proves ##PERF## is the only line --perf adds.
      determinism: routing-compare --scenario=paper --nNodes=20 --time=30 --runs=1 --protocols=olsr --perf=0 --firstRun={seed}
      # routing-compare prints the seed (`firstRun=` in ##CONFIG##, the run index
      # after each marker tag); strip both before the cross-seed comparison, so
      # "seed 2 differs" has to come from the results (swarm-routing/.github#40).
      determinism-normalize: 's/firstRun=[0-9]+//; s/^(##[A-Z]+##) [0-9]+ /\1 /'
      # Strict warnings as errors on the harness's own code (ns-3's headers
      # exempt; #31). Automatic runs (`latest`, debug and sanitized) only: an
      # on-demand older image may predate --strict-warnings.
      strict-warnings: ${{ inputs.ns3-versions == '' }}
      # SonarQube Cloud CI analysis with gcovr coverage of the harness on the
      # automatic `latest` debug leg (swarm-routing/.github CONTRIBUTING
      # § Quality gates; report-only). Skipped on fork PRs (no token) and while
      # the project is on Automatic Analysis.
      coverage: ${{ inputs.ns3-versions == '' }}
      sonar: ${{ inputs.ns3-versions == '' }}
      # coverage.py's report of python/ns3_tool into the same analysis (#67).
      sonar-python-coverage: python-coverage
      dual-roots: 'python/ tools/'
      core-roots: ''
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # The module's coverage report to Codecov (report-only; GitHub OIDC,
  # no Codecov token).
  codecov:
    needs: module
    if: inputs.ns3-versions == ''
    permissions:
      contents: read
      id-token: write
    uses: swarm-routing/.github/.github/workflows/reusable-codecov.yml@main
    with:
      flags: ns3

  # The Python job's coverage.py report to Codecov, flag `python` (#67).
  codecov-python:
    needs: python-quality
    permissions:
      contents: read
      id-token: write
    uses: swarm-routing/.github/.github/workflows/reusable-codecov.yml@main
    with:
      artifact: python-coverage
      files: coverage.xml
      flags: python

  stock-arms:
    name: stock arms deliver (${{ matrix.arms }} on ns-${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/swarm-routing/ns3-dev:${{ matrix.version }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: latest
            arms: olsr dsdv hwmp
          - version: '3.48'  # aodv: 'latest' once ns3-containers#35 is fixed
            arms: aodv
    # No Harden-Runner here (swarm-routing/.github#164): a job that runs entirely
    # in a container cannot take it on a GitHub-hosted runner (it needs sudo on the VM).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build routing-bench alone (stock ns-3 only) and run its suite
        run: ns3-build-contrib --test "routing-bench=$GITHUB_WORKSPACE/ns3/routing-bench"
      - name: Every listed arm delivers; an unknown arm aborts
        run: bash tools/checks/check-stock-arms.sh /opt/ns-3 "${{ matrix.arms }}"
      - name: "One ##PERF## line per arm and seed, and no other byte moves (#91)"
        if: matrix.version == 'latest'
        timeout-minutes: 15
        run: bash tools/checks/check-perf-markers.sh /opt/ns-3 "olsr dsdv"

  scaffold:
    # ns3-tool scaffold (#39): the skeleton it writes builds as a contrib module
    # beside routing-bench with strict warnings, routing-compare offers its arm,
    # and the arm (stock OLSR until replaced) delivers.
    name: ns3-tool scaffold builds and registers an arm
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/swarm-routing/ns3-dev:latest-debug
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # No Harden-Runner here (swarm-routing/.github#164): a job that runs entirely
    # in a container cannot take it on a GitHub-hosted runner.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scaffold an arm module
        run: python3 python/ns3_tool/cli.py scaffold scaffold-demo --out /tmp/scaffold --holder "ns3-tools CI"
      - name: Build it beside routing-bench (strict warnings)
        run: ns3-build-contrib --strict-warnings "routing-bench=$GITHUB_WORKSPACE/ns3/routing-bench" scaffold-demo=/tmp/scaffold/scaffold-demo
      - name: routing-compare offers the arm, and it delivers
        timeout-minutes: 15
        run: bash tools/checks/check-scaffold-arm.sh /opt/ns-3 scaffold-demo
