# Codecov (https://docs.codecov.com/docs/codecov-yaml). Two uploads, both by
# reusable-codecov.yml from ns3.yml: flag `ns3`, the reusable ns-3 CI's gcovr
# report of this repository's own modules (tests, examples and ns-3 itself
# excluded), and flag `python`, coverage.py's report of python/ns3_tool (#67).
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%
comment:
  layout: "reach,diff,flags,files"
  require_changes: true
